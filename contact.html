<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Hugh Opie</title>
<meta name="description" content="Contact Hugh Opie, junior copywriter with a background in design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
   :root{
    --blue:#1450C8;
    --black:#0A0A0A;
    --paper:#FBFAF7;
    --white:#FFFFFF;
    --line:rgba(20,80,200,.58);
    --muted:#6F7790;
    --page-pad:clamp(24px,3.4vw,58px);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{scroll-behavior:smooth;}

  body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--paper);
    color:var(--blue);
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .page{
    width:100%;
    max-width:1600px;
    min-height:100vh;
    min-height:100svh;
    margin:0 auto;
    padding:20px var(--page-pad) 22px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HEADER ---------- */
  .site-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:32px;
    min-height:72px;
  }

  .brand-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:52px;
    height:52px;
    flex:0 0 auto;
    text-decoration:none;
  }

  .brand-mark img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }

  .nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:clamp(26px,3.6vw,64px);
    padding-top:16px;
  }

  .nav a{
    position:relative;
    padding-bottom:9px;
    text-decoration:none;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.01em;
  }

  .nav a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:1.5px;
    background:var(--blue);
    transition:width .22s ease;
  }

  .nav a:hover::after,
  .nav a.active::after{width:100%;}

  /* ---------- HERO ---------- */
  .contact-hero{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:minmax(0,1.6fr) minmax(360px,.9fr);
    gap:clamp(64px,9vw,150px);
    align-items:center;
    padding:clamp(44px,6vh,88px) 0 clamp(54px,7vh,100px);
  }

  .contact-title{
    display:flex;
    flex-direction:column;
    gap:.10em;
    font-family:'Anton','Arial Narrow',Impact,sans-serif;
    font-size:clamp(112px,14.2vw,220px);
    line-height:.86;
    font-weight:400;
    letter-spacing:-.012em;
    text-transform:uppercase;
  }

  .contact-title span{display:block;}

  .hero-links{
    justify-self:end;
    width:min(100%,470px);
  }

  .hero-links-label{
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  .hero-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:17px 0;
    border-bottom:1px solid rgba(20,80,200,.22);
    text-decoration:none;
    color:var(--black);
    font-size:17px;
    line-height:1.2;
    font-weight:600;
  }

  .hero-link .arrow{
    color:var(--blue);
    font-family:Arial,sans-serif;
    font-size:20px;
    font-weight:400;
    transition:transform .2s ease;
  }

  .hero-link:hover .arrow{transform:translateX(4px);}

  .hero-link--placeholder{cursor:default;}

  .hero-link--placeholder .placeholder-note{
    color:var(--muted);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:10px;
    line-height:1;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  /* ---------- FOOTER ---------- */
  .site-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:28px;
    padding:18px 0 2px;
    border-top:1px solid var(--line);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:11px;
    line-height:1;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--blue);
  }

  .footer-links{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:26px;
    flex-wrap:wrap;
  }

  .footer-links a{
    color:inherit;
    text-decoration:none;
  }

  .footer-links a:hover{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  :focus-visible{
    outline:2px solid var(--blue);
    outline-offset:4px;
  }

  /* ---------- TABLET ---------- */
  @media (max-width:1180px){
    .contact-hero{
      grid-template-columns:1fr;
      gap:38px;
      align-content:center;
      padding:42px 0 64px;
    }

    .contact-title{
      font-size:clamp(92px,18vw,170px);
    }

    .hero-links{
      justify-self:start;
      width:min(100%,680px);
    }

  }

  /* ---------- MOBILE ---------- */
  @media (max-width:680px){
    .page{padding:18px 18px 20px;}

    .site-header{
      min-height:auto;
      align-items:center;
      margin-bottom:0;
    }

    .brand-mark{width:42px;height:42px;}

    .nav{
      gap:16px;
      padding-top:0;
      flex-wrap:wrap;
    }

    .nav a{
      font-size:10px;
      padding-bottom:6px;
    }

    .contact-hero{
      flex:0 0 auto;
      gap:34px;
      padding:42px 0 56px;
    }

    .contact-title{
      gap:.08em;
      font-size:clamp(76px,24vw,118px);
      line-height:.88;
    }

    .hero-links{width:100%;}
    .hero-link{padding:16px 0;font-size:16px;}

    .site-footer{
      align-items:flex-start;
      flex-direction:column;
      gap:14px;
      padding-top:16px;
      font-size:10px;
    }

    .footer-links{
      justify-content:flex-start;
      gap:18px;
    }
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none!important;}
  }
</style>
</head>
<body>

<main class="page">
  <header class="site-header">
    <a class="brand-mark" href="/" aria-label="Hugh Opie home">
      <img src="favicon.png" alt="">
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="/">Work</a>
      <a href="/side-quests">Side Quests</a>
      <a href="/about">About</a>
      <a href="/contact" class="active" aria-current="page">Contact</a>
    </nav>
  </header>

  <section class="contact-hero" aria-labelledby="page-title">
    <h1 class="contact-title" id="page-title"><span>Let's</span><span>Talk</span></h1>

    <div class="hero-links" aria-label="Contact links">
      <div class="hero-links-label">Heya!</div>

      <a class="hero-link" href="mailto:hugh@hopie.com.au">
        <span>Email</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="hero-link" href="https://www.linkedin.com/in/hugh-opie" target="_blank" rel="noopener noreferrer">
        <span>LinkedIn</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="hero-link" href="https://www.instagram.com/hopie.edit/" target="_blank" rel="noopener noreferrer">
        <span>Instagram</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="hero-link" href="https://substack.com/@thejuniorcreative/notes" target="_blank" rel="noopener noreferrer">
        <span>Substack</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="hero-link" href="Hugh_Opie_Resume.pdf" download>
        <span>Résumé</span>
        <span class="arrow" aria-hidden="true">↓</span>
      </a>
    </div>
  </section>

  <footer class="site-footer">
    <span>© <span id="footerYear"></span> Hugh Opie</span>
    <div class="footer-links">
      <a href="mailto:hugh@hopie.com.au">Email</a>
      <a href="https://www.linkedin.com/in/hugh-opie" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="Hugh_Opie_Resume.pdf" download>Résumé</a>
    </div>
  </footer>
</main>

<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>

</body>
</html>
