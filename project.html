<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-blue:#1450C8;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --border-grey:#E4E4E4;
    --mute-grey:#B9B9B9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{ height:100%; }

  body{
    min-height:100vh;
    /* Detail pages scroll — case studies run longer than the gallery view */
    overflow-y:auto;
    background:var(--white);
    font-family:'Inter', sans-serif;
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:2vh 2vw 6vh;
  }

  .frame{
    width:100%;
    max-width:1440px;
    border:1px solid var(--border-grey);
    border-radius:20px;
    padding:2.4vh 2.4vw 6vh;
    display:flex;
    flex-direction:column;
    gap:2.6vh;
  }

  /* ---------- NAV (shared pattern across pages) ---------- */
  .top-nav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:2.4vw;
  }

  .nav-link{
    text-decoration:none;
    color:var(--black);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:clamp(11px, 1vw, 13px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    transition:color .25s ease;
  }

  .nav-link::after{
    content:'';
    position:absolute;
    left:0; bottom:0;
    width:0%;
    height:1.5px;
    background:var(--deep-blue);
    transition:width .3s ease;
  }

  .nav-link:hover{color:var(--deep-blue);}
  .nav-link:hover::after{width:100%;}

  .nav-link.active{
    color:var(--deep-blue);
    font-weight:700;
  }
  .nav-link.active::after{ width:100%; }

  .nav-link:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  /* ---------- BACK CONTROL ---------- */
  .back-link{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:8px;
    width:fit-content;
    text-decoration:none;
    color:var(--black);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:8px 4px;
    transition:color .25s ease, gap .25s ease;
  }

  .back-link:hover{
    color:var(--deep-blue);
    gap:12px;
  }

  .back-link:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  /* ---------- HERO HEADER ---------- */
  .hero-header{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:1.4vh;
    padding-bottom:1vh;
    border-bottom:1px solid var(--border-grey);
  }

  .pagination{
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(16px, 1.8vw, 22px);
    color:var(--deep-blue);
    letter-spacing:-0.01em;
  }

  .pagination .slash{ color:var(--mute-grey); font-weight:400; margin:0 2px; }
  .pagination .total{ color:var(--mute-grey); }

  .project-title{
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(32px, 5.4vw, 68px);
    line-height:1.02;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    color:var(--deep-blue);
    max-width:20ch;
  }

  .meta-strip{
    display:flex;
    flex-wrap:wrap;
    gap:6px 28px;
  }

  .meta-strip .meta-item{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .meta-strip .meta-label{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mute-grey);
  }

  .meta-strip .meta-value{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--black);
  }

  /* ---------- SHOWCASE MEDIA ---------- */
  .showcase{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:3vh;
  }

  .hero-image{
    position:relative;
    width:100%;
    aspect-ratio:16/9; /* fallback until JS measures the real image and adjusts this */
    border-radius:12px;
    overflow:hidden;
    background:#f2f2f2;
  }

  .hero-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .description{
    max-width:70ch;
    font-size:clamp(14px, 1.15vw, 17px);
    line-height:1.7;
    color:var(--black);
  }

  /* Adaptive gallery: each figure's aspect-ratio is set by JS to match its
     image's real proportions (see the "ADAPTIVE ORIENTATION" script below),
     so nothing is ever cropped. Landscape tiles span the full row width;
     portrait/square tiles sit two-up. Default below is just the pre-load state. */
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1.6vw;
  }

  .gallery-grid figure{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    background:#f2f2f2;
    aspect-ratio:4/3;
    transition:box-shadow .3s ease, transform .3s ease, aspect-ratio .2s ease;
  }

  .gallery-grid figure.is-landscape{
    grid-column:1 / -1;
  }

  .gallery-grid img{
    width:100%;
    height:100%;
    object-fit:cover; /* safe once the figure's aspect-ratio matches the image exactly */
    display:block;
    cursor:pointer;
  }

  .gallery-grid figure:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(0,0,0,0.14);
  }

  .hero-image img{ cursor:pointer; }

  /* ---------- AWARD PILL BADGE (project or gallery item with an `award` set) ---------- */
  /* Always visible — no hover needed. Solid white/blue palette per the site design system. */
  .badge-pill{
    position:absolute;
    top:12px;
    right:12px;
    z-index:30;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    border:1.5px solid var(--deep-blue);
    border-radius:9999px;
    padding:8px 18px 8px 8px;
    color:var(--deep-blue);
    pointer-events:none;
    box-shadow:0 4px 12px rgba(20,80,200,0.18);
  }

  .badge-pill-icon{
    width:20px;
    height:20px;
    flex:0 0 auto;
    color:var(--deep-blue);
  }

  .badge-pill-icon svg{
    width:100%;
    height:100%;
    display:block;
  }

  .badge-pill-label{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:16px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    white-space:nowrap;
    line-height:1;
  }

  .badge-pill--sm{
    top:8px;
    right:8px;
    padding:5px 13px 5px 5px;
    gap:4px;
  }

  .badge-pill--sm .badge-pill-icon{ width:21px; height:21px; }
  .badge-pill--sm .badge-pill-label{ font-size:11px; letter-spacing:0.03em; }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,10,10,0.9);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease, visibility .25s ease;
  }

  .lightbox.is-open{
    opacity:1;
    visibility:visible;
  }

  .lightbox-figure{
    position:relative;
    max-width:92vw;
    max-height:88vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .lightbox-img{
    max-width:92vw;
    max-height:88vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    user-select:none;
    -webkit-user-drag:none;
  }

  .lightbox-close,
  .lightbox-nav{
    position:fixed;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--white);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background-color .2s ease, transform .2s ease;
  }

  .lightbox-close:hover,
  .lightbox-nav:hover{
    background:rgba(255,255,255,0.22);
    transform:translateY(-2px);
  }

  .lightbox-close{
    top:24px;
    right:24px;
    width:42px;
    height:42px;
  }

  .lightbox-close svg{ width:18px; height:18px; }

  .lightbox-nav{
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
  }

  .lightbox-nav:hover{ transform:translateY(-52%); }

  .lightbox-nav svg{ width:20px; height:20px; }

  .lightbox-prev{ left:24px; }
  .lightbox-next{ right:24px; }

  .lightbox-counter{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.7);
  }

  @media (max-width: 640px){
    .lightbox-nav{ width:40px; height:40px; }
    .lightbox-prev{ left:10px; }
    .lightbox-next{ right:10px; }
    .lightbox-close{ top:14px; right:14px; width:38px; height:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    .lightbox{ transition:none; }
    .gallery-grid figure{ transition:none; }
  }

  /* ---------- NEXT PROJECT / FOOTER NAV ---------- */
  .footer-nav{
    flex:0 0 auto;
    margin-top:1vh;
    padding-top:2.6vh;
    border-top:1px solid var(--border-grey);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .footer-nav a{
    text-decoration:none;
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--deep-blue);
    border-bottom:1.5px solid var(--deep-blue);
    padding-bottom:3px;
    transition:letter-spacing .25s ease;
  }

  .footer-nav a:hover{ letter-spacing:0.16em; }

  /* ---------- SITE FOOTER ---------- */
  .site-footer{
    flex:0 0 auto;
    margin-top:1vh;
    padding-top:2vh;
    border-top:1px solid var(--border-grey);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .footer-copy{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--mute-grey);
    white-space:nowrap;
  }

  .footer-copy .dot{ color:var(--border-grey); }

  .footer-social{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .footer-social a{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border-grey);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--deep-blue);
    text-decoration:none;
    transition:background-color .25s ease, border-color .25s ease, color .25s ease, transform .2s ease;
  }

  .footer-social a svg{
    width:13px;
    height:13px;
    fill:currentColor;
  }

  .footer-social a:hover{
    background:var(--deep-blue);
    border-color:var(--deep-blue);
    color:var(--white);
    transform:translateY(-2px);
  }

  .footer-social a:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  @media (max-width: 480px){
    .site-footer{
      flex-wrap:wrap;
      gap:12px;
    }
    .footer-copy{ white-space:normal; }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 768px){
    body{ padding:16px 16px 40px; }

    .frame{
      border-radius:16px;
      padding:20px 16px 40px;
      gap:20px;
    }

    .top-nav{ flex-wrap:wrap; gap:20px; }

    .project-title{ max-width:100%; font-size:clamp(28px, 9vw, 42px); }

    .gallery-grid{
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
  }

  @media (max-width: 480px){
    .gallery-grid{ grid-template-columns:1fr; }
    .meta-strip{ gap:12px 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>

<script src="projects.js"></script>
<script>
  /* =========================================================
     PROJECT DETAIL PAGE LOGIC
     Reads ?id=01 (etc.) from the URL, matches it against the
     shared `projects` array (projects.js), and populates the
     page. Falls back to the first project if the id is missing
     or doesn't match anything.
     ========================================================= */

  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get('id');

  let project = projects.find(p => p.id === requestedId);
  let usedFallback = false;

  if (!project) {
    // Fallback: default to Project 01 rather than a broken page
    project = projects[0];
    usedFallback = true;
  }

  const index = projects.findIndex(p => p.id === project.id);

  // ---- Populate page ----
  document.getElementById('pageTitle').textContent = `${project.title} — Portfolio`;

  const paginationEl = document.getElementById('pagination');
  paginationEl.innerHTML =
    `${String(index + 1).padStart(2, '0')}<span class="slash">/</span><span class="total">${String(projects.length).padStart(2, '0')}</span>`;

  document.getElementById('projectTitle').textContent = project.title;

  const metaStrip = document.getElementById('metaStrip');
  metaStrip.innerHTML = `
    <div class="meta-item">
      <span class="meta-label">Category</span>
      <span class="meta-value">${project.category}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Role</span>
      <span class="meta-value">${project.role}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Year</span>
      <span class="meta-value">${project.year}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Subtitle</span>
      <span class="meta-value">${project.subheading}</span>
    </div>
  `;

  // Pill badge markup — used on any project/gallery item with an `award` object set.
  // Always visible (no hover needed), fixed white/blue palette per the site design system.
  function defaultLabelForType(type){
    if (type === 'best_in_book') return 'BEST IN BOOK';
    if (type === 'second_best_in_book') return 'SECOND BEST IN BOOK';
    if (type === 'best_in_brief') return 'BEST IN BRIEF';
    return '';
  }

  function badgeHTML(award, sizeClass){
    if (!award) return '';
    const label = award.label || defaultLabelForType(award.type);
    if (!label) return '';
    return `
      <div class="badge-pill${sizeClass ? ' ' + sizeClass : ''}">
        <span class="badge-pill-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 5.3l1.9 4.1 4.4.5-3.3 3 .9 4.4-3.9-2.3-3.9 2.3.9-4.4-3.3-3 4.4-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="badge-pill-label">${label}</span>
      </div>
    `;
  }

  // Gallery entries may be a plain string URL, or { src, award } for a per-image badge
  function galleryItemSrc(item){
    return typeof item === 'string' ? item : item.src;
  }
  function galleryItemAward(item){
    return typeof item === 'string' ? null : (item.award || null);
  }

  /* =========================================================
     ADAPTIVE ORIENTATION
     Instead of forcing every image into one fixed aspect box,
     we read each image's real width/height once it loads and
     set its container's aspect-ratio to match exactly — so
     landscape, portrait, and square shots all display in full,
     with zero cropping. Landscape tiles also get a full-width
     grid span so they aren't squeezed into a half-width column.
     ========================================================= */
  function fitContainerToImage(img, container, opts){
    opts = opts || {};
    function apply(){
      if (!img.naturalWidth || !img.naturalHeight) return;
      const ratio = img.naturalWidth / img.naturalHeight;
      container.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      if (opts.landscapeSpanClass){
        container.classList.toggle(opts.landscapeSpanClass, ratio >= 1.2);
      }
    }
    if (img.complete && img.naturalWidth){
      apply();
    } else {
      img.addEventListener('load', apply, { once: true });
    }
  }

  const heroImage = document.getElementById('heroImage');
  heroImage.src = project.fullImage;
  heroImage.alt = project.title;
  fitContainerToImage(heroImage, heroImage.closest('.hero-image'));

  document.getElementById('heroBadgeSlot').innerHTML =
    project.award ? badgeHTML(project.award, '') : '';

  document.getElementById('description').textContent = project.description;

  const galleryGrid = document.getElementById('galleryGrid');
  galleryGrid.innerHTML = (project.gallery || [])
    .map(item => {
      const src = galleryItemSrc(item);
      const award = galleryItemAward(item);
      return `<figure>
        <img src="${src}" alt="${project.title} detail image" loading="lazy">
        ${award ? badgeHTML(award, 'badge-pill--sm') : ''}
      </figure>`;
    })
    .join('');

  // Wire up adaptive sizing for every gallery tile
  Array.from(galleryGrid.querySelectorAll('figure')).forEach((figure) => {
    const img = figure.querySelector('img');
    fitContainerToImage(img, figure, { landscapeSpanClass: 'is-landscape' });
  });

  /* =========================================================
     LIGHTBOX — full-screen gallery viewer
     Combines the hero image + gallery shots into one navigable
     set. Opens on click, closes on X / backdrop / Esc, navigates
     with arrows, arrow keys, or touch swipe.
     ========================================================= */
  (function(){
    const lightboxImages = [project.fullImage, ...(project.gallery || []).map(galleryItemSrc)];

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const closeBtn = document.getElementById('lightboxClose');
    const prevBtn = document.getElementById('lightboxPrev');
    const nextBtn = document.getElementById('lightboxNext');

    let lbIndex = 0;

    function showIndex(i){
      lbIndex = (i + lightboxImages.length) % lightboxImages.length;
      lightboxImg.src = lightboxImages[lbIndex];
      lightboxImg.alt = `${project.title} — image ${lbIndex + 1} of ${lightboxImages.length}`;
      lightboxCounter.textContent = `${String(lbIndex + 1).padStart(2, '0')} / ${String(lightboxImages.length).padStart(2, '0')}`;
    }

    function openLightbox(i){
      showIndex(i);
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(){
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    function lbNext(){ showIndex(lbIndex + 1); }
    function lbPrev(){ showIndex(lbIndex - 1); }

    // Hook up click targets: hero image is lightboxImages[0],
    // gallery figures are lightboxImages[1..]
    heroImage.addEventListener('click', () => openLightbox(0));

    Array.from(galleryGrid.querySelectorAll('img')).forEach((img, i) => {
      img.addEventListener('click', () => openLightbox(i + 1));
    });

    closeBtn.addEventListener('click', closeLightbox);
    nextBtn.addEventListener('click', lbNext);
    prevBtn.addEventListener('click', lbPrev);

    // Backdrop click closes (but not clicks on the image itself or controls)
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Keyboard: Esc closes, arrows navigate
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') lbNext();
      if (e.key === 'ArrowLeft') lbPrev();
    });

    // Touch swipe
    let lbTouchStartX = null;
    lightbox.addEventListener('touchstart', (e) => {
      lbTouchStartX = e.touches[0].clientX;
    }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      if (lbTouchStartX === null) return;
      const dx = e.changedTouches[0].clientX - lbTouchStartX;
      if (Math.abs(dx) > 40){
        dx < 0 ? lbNext() : lbPrev();
      }
      lbTouchStartX = null;
    }, { passive: true });
  })();

  // ---- Prev / Next project links (wraps around) ----
  const prevIndex = (index - 1 + projects.length) % projects.length;
  const nextIndex = (index + 1) % projects.length;

  const prevLink = document.getElementById('prevLink');
  const nextLink = document.getElementById('nextLink');

  prevLink.href = `project.html?id=${projects[prevIndex].id}`;
  prevLink.textContent = `\u2190 ${projects[prevIndex].title}`;

  nextLink.href = `project.html?id=${projects[nextIndex].id}`;
  nextLink.textContent = `${projects[nextIndex].title} \u2192`;

  if (usedFallback && requestedId) {
    console.warn(`No project found for id "${requestedId}" — showing "${project.title}" instead.`);
  }

  // Footer copyright year
  document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>
