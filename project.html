<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-blue:#0B1E4B;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --border-grey:#E4E4E4;
    --mute-grey:#B9B9B9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{ height:100%; }

  body{
    min-height:100vh;
    /* Detail pages scroll — case studies run longer than the gallery view */
    overflow-y:auto;
    background:var(--white);
    font-family:'Inter', sans-serif;
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:2vh 2vw 6vh;
  }

  .frame{
    width:100%;
    max-width:1440px;
    border:1px solid var(--border-grey);
    border-radius:20px;
    padding:2.4vh 2.4vw 6vh;
    display:flex;
    flex-direction:column;
    gap:2.6vh;
  }

  /* ---------- NAV (shared pattern across pages) ---------- */
  .top-nav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:2.4vw;
  }

  .nav-link{
    text-decoration:none;
    color:var(--black);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:clamp(11px, 1vw, 13px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    transition:color .25s ease;
  }

  .nav-link::after{
    content:'';
    position:absolute;
    left:0; bottom:0;
    width:0%;
    height:1.5px;
    background:var(--deep-blue);
    transition:width .3s ease;
  }

  .nav-link:hover{color:var(--deep-blue);}
  .nav-link:hover::after{width:100%;}

  .nav-link.active{
    color:var(--deep-blue);
    font-weight:700;
  }
  .nav-link.active::after{ width:100%; }

  .nav-link:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  /* ---------- BACK CONTROL ---------- */
  .back-link{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:8px;
    width:fit-content;
    text-decoration:none;
    color:var(--black);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:8px 4px;
    transition:color .25s ease, gap .25s ease;
  }

  .back-link:hover{
    color:var(--deep-blue);
    gap:12px;
  }

  .back-link:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  /* ---------- HERO HEADER ---------- */
  .hero-header{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:1.4vh;
    padding-bottom:1vh;
    border-bottom:1px solid var(--border-grey);
  }

  .pagination{
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(16px, 1.8vw, 22px);
    color:var(--deep-blue);
    letter-spacing:-0.01em;
  }

  .pagination .slash{ color:var(--mute-grey); font-weight:400; margin:0 2px; }
  .pagination .total{ color:var(--mute-grey); }

  .project-title{
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(32px, 5.4vw, 68px);
    line-height:1.02;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    color:var(--black);
    max-width:20ch;
  }

  .meta-strip{
    display:flex;
    flex-wrap:wrap;
    gap:6px 28px;
  }

  .meta-strip .meta-item{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .meta-strip .meta-label{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mute-grey);
  }

  .meta-strip .meta-value{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--black);
  }

  /* ---------- SHOWCASE MEDIA ---------- */
  .showcase{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:3vh;
  }

  .hero-image{
    width:100%;
    aspect-ratio:16/9;
    border-radius:12px;
    overflow:hidden;
    background:#f2f2f2;
  }

  .hero-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .description{
    max-width:70ch;
    font-size:clamp(14px, 1.15vw, 17px);
    line-height:1.7;
    color:var(--black);
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1.4vw;
  }

  .gallery-grid figure{
    border-radius:10px;
    overflow:hidden;
    background:#f2f2f2;
    aspect-ratio:3/4;
  }

  .gallery-grid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- NEXT PROJECT / FOOTER NAV ---------- */
  .footer-nav{
    flex:0 0 auto;
    margin-top:1vh;
    padding-top:2.6vh;
    border-top:1px solid var(--border-grey);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .footer-nav a{
    text-decoration:none;
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--deep-blue);
    border-bottom:1.5px solid var(--deep-blue);
    padding-bottom:3px;
    transition:letter-spacing .25s ease;
  }

  .footer-nav a:hover{ letter-spacing:0.16em; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 768px){
    body{ padding:16px 16px 40px; }

    .frame{
      border-radius:16px;
      padding:20px 16px 40px;
      gap:20px;
    }

    .top-nav{ flex-wrap:wrap; gap:20px; }

    .project-title{ max-width:100%; font-size:clamp(28px, 9vw, 42px); }

    .gallery-grid{
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
  }

  @media (max-width: 480px){
    .gallery-grid{ grid-template-columns:1fr; }
    .meta-strip{ gap:12px 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="frame">

  <!-- NAVIGATION -->
  <nav class="top-nav">
    <a href="index.html" class="nav-link">Work</a>
    <a href="about.html" class="nav-link">About Me</a>
    <a href="side-quests.html" class="nav-link">Side Quests</a>
  </nav>

  <!-- BACK CONTROL -->
  <a href="index.html" class="back-link">&larr; Back to Gallery</a>

  <!-- HERO HEADER -->
  <header class="hero-header">
    <div class="pagination" id="pagination"></div>
    <h1 class="project-title" id="projectTitle">Loading…</h1>
    <div class="meta-strip" id="metaStrip"></div>
  </header>

  <!-- SHOWCASE MEDIA -->
  <section class="showcase">
    <div class="hero-image">
      <img id="heroImage" src="" alt="">
    </div>

    <p class="description" id="description"></p>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- FOOTER NAV -->
  <div class="footer-nav">
    <a href="index.html" id="prevLink">&larr; Previous Project</a>
    <a href="index.html" id="nextLink">Next Project &rarr;</a>
  </div>

</div>

<script src="projects.js"></script>
<script>
  /* =========================================================
     PROJECT DETAIL PAGE LOGIC
     Reads ?id=01 (etc.) from the URL, matches it against the
     shared `projects` array (projects.js), and populates the
     page. Falls back to the first project if the id is missing
     or doesn't match anything.
     ========================================================= */

  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get('id');

  let project = projects.find(p => p.id === requestedId);
  let usedFallback = false;

  if (!project) {
    // Fallback: default to Project 01 rather than a broken page
    project = projects[0];
    usedFallback = true;
  }

  const index = projects.findIndex(p => p.id === project.id);

  // ---- Populate page ----
  document.getElementById('pageTitle').textContent = `${project.title} — Portfolio`;

  const paginationEl = document.getElementById('pagination');
  paginationEl.innerHTML =
    `${String(index + 1).padStart(2, '0')}<span class="slash">/</span><span class="total">${String(projects.length).padStart(2, '0')}</span>`;

  document.getElementById('projectTitle').textContent = project.title;

  const metaStrip = document.getElementById('metaStrip');
  metaStrip.innerHTML = `
    <div class="meta-item">
      <span class="meta-label">Category</span>
      <span class="meta-value">${project.category}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Role</span>
      <span class="meta-value">${project.role}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Year</span>
      <span class="meta-value">${project.year}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Subtitle</span>
      <span class="meta-value">${project.subheading}</span>
    </div>
  `;

  const heroImage = document.getElementById('heroImage');
  heroImage.src = project.fullImage;
  heroImage.alt = project.title;

  document.getElementById('description').textContent = project.description;

  const galleryGrid = document.getElementById('galleryGrid');
  galleryGrid.innerHTML = (project.gallery || [])
    .map(src => `<figure><img src="${src}" alt="${project.title} detail image" loading="lazy"></figure>`)
    .join('');

  // ---- Prev / Next project links (wraps around) ----
  const prevIndex = (index - 1 + projects.length) % projects.length;
  const nextIndex = (index + 1) % projects.length;

  const prevLink = document.getElementById('prevLink');
  const nextLink = document.getElementById('nextLink');

  prevLink.href = `project.html?id=${projects[prevIndex].id}`;
  prevLink.textContent = `\u2190 ${projects[prevIndex].title}`;

  nextLink.href = `project.html?id=${projects[nextIndex].id}`;
  nextLink.textContent = `${projects[nextIndex].title} \u2192`;

  if (usedFallback && requestedId) {
    console.warn(`No project found for id "${requestedId}" — showing "${project.title}" instead.`);
  }
</script>

</body>
</html>
