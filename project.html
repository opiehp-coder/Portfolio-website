<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    if(sessionStorage.getItem('portfolioUnlocked') !== 'true'){
      window.location.replace('index.html');
    }
  </script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project — Hugh Opie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1450C8;
    --black:#0A0A0A;
    --paper:#FBFAF7;
    --white:#FFFFFF;
    --line:rgba(20,80,200,.58);
    --soft-line:rgba(20,80,200,.20);
    --muted:#6F7790;
    --page-pad:clamp(24px,3.4vw,58px);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}

  body{
    background:var(--paper);
    color:var(--black);
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font:inherit;}

  .page{
    width:100%;
    max-width:1600px;
    margin:0 auto;
    padding:20px var(--page-pad) 38px;
  }

  /* ---------- SHARED HEADER ---------- */
  .site-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:32px;
    min-height:82px;
  }

  .brand-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:52px;
    height:52px;
    flex:0 0 auto;
    text-decoration:none;
  }

  .brand-mark img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:clamp(26px,3.6vw,64px);
    padding-top:16px;
  }

  .nav a{
    position:relative;
    color:var(--blue);
    text-decoration:none;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.01em;
    padding-bottom:9px;
  }

  .nav a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:1.5px;
    background:var(--blue);
    transition:width .22s ease;
  }

  .nav a:hover::after,
  .nav a.active::after{width:100%;}

  /* ---------- TOP PROJECT CONTROLS ---------- */
  .project-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin:2px 0 22px;
  }

  .all-work,
  .next-project{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:var(--blue);
    text-decoration:none;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.02em;
  }

  .all-work .arrow,
  .next-project .arrow{
    font-family:Arial,sans-serif;
    font-size:21px;
    line-height:.7;
    transition:transform .2s ease;
  }

  .all-work:hover .arrow{transform:translateX(-4px);}
  .next-project:hover .arrow{transform:translateX(4px);}

  .project-tools-right{
    display:flex;
    align-items:center;
    gap:clamp(24px,3vw,48px);
  }

  .project-count{
    color:var(--black);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:800;
    letter-spacing:.02em;
  }

  .project-count .current{color:var(--blue);}

  /* ---------- PROJECT INTRO ---------- */
  .project-intro{
    padding:clamp(32px,4.2vw,68px) 0 32px;
  }

  .project-title{
    color:var(--blue);
    font-family:'Anton','Arial Narrow',Impact,sans-serif;
    font-size:clamp(66px,8.6vw,142px);
    line-height:.88;
    font-weight:400;
    letter-spacing:-.012em;
    text-transform:uppercase;
    max-width:none;
    text-wrap:balance;
  }

  .project-subline{
    margin-top:16px;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:13px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
  }

  /* ---------- STRATEGY ---------- */
  .strategy-section{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--soft-line);
    padding:28px 0 34px;
  }

  .strategy-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(30px,5vw,80px);
  }

  .strategy-grid--overview{
    grid-template-columns:minmax(0,1.55fr) minmax(0,.72fr) minmax(0,.72fr);
  }

  .strategy-item h2,
  .strategy-meta strong{
    display:block;
    margin-bottom:9px;
    color:var(--blue);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.035em;
  }

  .strategy-item p{
    max-width:46ch;
    font-size:clamp(14px,1.1vw,17px);
    line-height:1.52;
    letter-spacing:-.01em;
  }

  .strategy-meta span{
    display:block;
    font-size:14px;
    line-height:1.45;
  }

  .project-meta-strip{
    display:grid;
    grid-template-columns:1fr 1fr .55fr;
    gap:36px;
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid var(--soft-line);
  }

  .meta-block:last-child{text-align:right;}

  .meta-block strong{
    display:block;
    margin-bottom:6px;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:10px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .meta-block span{
    display:block;
    font-size:13px;
    line-height:1.45;
  }

  /* ---------- EXECUTIONS ---------- */
  .executions{
    padding:42px 0 44px;
  }

  .section-heading{
    display:grid;
    grid-template-columns:auto minmax(40px,1fr);
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }

  .section-heading h2{
    color:var(--blue);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .section-rule{height:1px;background:var(--line);}

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  }

  .gallery-item{
    position:relative;
    overflow:hidden;
    background:#e8ebef;
    cursor:pointer;
  }

  .gallery-item.is-landscape{grid-column:1 / -1;}

  .gallery-item img{
    display:block;
    width:100%;
    height:auto;
  }

  .gallery-item:not(.is-landscape) img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .gallery-caption{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:10px 0 2px;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:10px;
    line-height:1.2;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.035em;
    color:var(--blue);
  }

  /* ---------- AWARD BADGES ---------- */
  .badge-pill{
    position:absolute;
    top:12px;
    right:12px;
    z-index:3;
    display:inline-flex;
    align-items:center;
    background:var(--paper);
    border:1px solid var(--blue);
    padding:7px 10px;
    color:var(--blue);
    pointer-events:none;
  }

  .badge-pill-label{
    font-family:'Montserrat',Arial,sans-serif;
    font-size:10px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.035em;
    white-space:nowrap;
  }

  .badge-pill--sm{top:8px;right:8px;padding:5px 7px;}
  .badge-pill--sm .badge-pill-label{font-size:8px;}

  /* ---------- NEXT PROJECT ---------- */
  .next-footer{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    padding:26px 0 30px;
    border-top:1px solid var(--line);
  }

  .next-footer-label{
    display:block;
    margin-bottom:6px;
    color:var(--blue);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:10px;
    line-height:1;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .next-footer-title{
    color:var(--blue);
    font-family:'Anton','Arial Narrow',Impact,sans-serif;
    font-size:clamp(36px,5vw,78px);
    line-height:.92;
    font-weight:400;
    text-transform:uppercase;
    text-decoration:none;
  }

  .next-footer-arrow{
    color:var(--blue);
    font-family:Arial,sans-serif;
    font-size:44px;
    line-height:1;
    text-decoration:none;
  }

  /* ---------- FOOTER ---------- */
  .site-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    padding:17px 0 4px;
    border-top:1px solid var(--line);
    color:var(--blue);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:11px;
    line-height:1;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .footer-links{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
  }

  .footer-links a{color:inherit;text-decoration:none;}
  .footer-links a:hover{text-decoration:underline;text-underline-offset:4px;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,10,10,.92);
    opacity:0;
    visibility:hidden;
    transition:opacity .2s ease,visibility .2s ease;
  }

  .lightbox.is-open{opacity:1;visibility:visible;}

  .lightbox-img{
    max-width:90vw;
    max-height:86vh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
  }

  .lightbox-close,
  .lightbox-nav{
    position:fixed;
    appearance:none;
    border:1px solid rgba(255,255,255,.35);
    background:transparent;
    color:var(--white);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .lightbox-close{top:22px;right:22px;width:42px;height:42px;font-size:24px;}
  .lightbox-nav{top:50%;transform:translateY(-50%);width:46px;height:46px;font-size:28px;}
  .lightbox-prev{left:22px;}
  .lightbox-next{right:22px;}

  .lightbox-counter{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    color:var(--white);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .strategy-grid,
    .strategy-grid--overview{grid-template-columns:1fr 1fr;gap:28px 40px;}
    .strategy-grid--overview .strategy-item:first-child{grid-column:1 / -1;}
    .project-meta-strip{grid-template-columns:1fr 1fr .5fr;}
  }

  @media (max-width:700px){
    .page{padding-top:16px;}

    .site-header{min-height:72px;}
    .brand-mark{width:42px;height:42px;}
    .nav{gap:18px;flex-wrap:wrap;padding-top:10px;}
    .nav a{font-size:10px;padding-bottom:7px;}

    .project-tools{margin-top:8px;align-items:flex-start;}
    .project-tools-right{gap:16px;}
    .all-work,.next-project,.project-count{font-size:10px;}

    .project-intro{padding:28px 0 24px;}
    .project-title{font-size:clamp(62px,18vw,108px);line-height:.88;}
    .project-subline{font-size:10px;margin-top:12px;}

    .strategy-grid,
    .strategy-grid--overview{grid-template-columns:1fr;gap:24px;}
    .strategy-grid--overview .strategy-item:first-child{grid-column:auto;}

    .project-meta-strip{grid-template-columns:1fr;gap:18px;}
    .meta-block:last-child{text-align:left;}

    .gallery-grid{grid-template-columns:1fr;gap:18px;}
    .gallery-item.is-landscape{grid-column:auto;}
    .gallery-item:not(.is-landscape) img{height:auto;object-fit:contain;}

    .next-footer{align-items:flex-start;}
    .site-footer{align-items:flex-start;flex-direction:column;font-size:10px;}
  }

  @media (max-width:470px){
    .nav{gap:12px 16px;}
    .next-project .label{display:none;}
    .project-tools-right{gap:12px;}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none!important;}
  }
</style>
</head>
<body>

<main class="page">
  <header class="site-header">
    <a class="brand-mark" href="work.html" aria-label="Hugh Opie home">
      <img src="favicon.png" alt="">
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="work.html" class="active">Work</a>
      <a href="side-quests.html">Side Quests</a>

  <div class="project-tools">

      <div class="project-count" id="projectCount"></div>
      <a class="next-project" id="nextTop" href="/">
        <span class="label">Next</span><span class="arrow" aria-hidden="true">→</span>
      </a>

  <header class="project-intro">
    <h1 class="project-title" id="projectTitle">Loading…</h1>

  <!-- Problem / Insight / Idea + supporting project information -->

  <section class="next-footer" aria-label="Next project">
    <div>
      <span class="next-footer-label">Next Project</span>
      <a class="next-footer-title" id="nextFooterTitle" href="/"></a>

  <footer class="site-footer">
    <span>© <span id="footerYear"></span> Hugh Opie</span>
    <div class="footer-links">
      <a href="mailto:hugh@hopie.com.au">Email</a>
      <a href="https://www.linkedin.com/in/hugh-opie" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="Hugh_Opie_Resume.pdf" download>Résumé</a>
    </div>
  </footer>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image viewer">×</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image">←</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next image">→</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script src="projects.js"></script>
<script>
  if(sessionStorage.getItem('portfolioUnlocked') !== 'true'){
    window.location.replace('/');
  }

  

  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get('id');

  const project = projects.find(p => p.id === requestedId) || projects[0];
  const projectIndex = projects.findIndex(p => p.id === project.id);
  const previousProject = projects[(projectIndex - 1 + projects.length) % projects.length];
  const nextProject = projects[(projectIndex + 1) % projects.length];

  function galleryItemSrc(item){
    return typeof item === 'string' ? item : item.src;
  }

  function galleryItemAward(item){
    return typeof item === 'string' ? null : (item.award || null);
  }

  function galleryItemLabel(item){
    if(typeof item === 'object') return item.label || item.title || '';
    return '';
  }

  function galleryItemCaption(item){
    if(typeof item === 'object' && item.caption) return item.caption;
    return '';
  }

  function defaultAwardLabel(type){
    if(type === 'best_in_book') return 'BEST IN BOOK';
    if(type === 'second_best_in_book') return 'SECOND BEST IN BOOK';
    if(type === 'best_in_brief') return 'BEST IN BRIEF';
    return '';
  }

  function badgeHTML(award,sizeClass=''){
    if(!award) return '';
    const label = award.label || defaultAwardLabel(award.type);
    if(!label) return '';
    return `<div class="badge-pill ${sizeClass}"><span class="badge-pill-label">${escapeHTML(label)}</span></div>`;
  }

  function escapeHTML(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  document.getElementById('pageTitle').textContent = `${project.title} — Hugh Opie`;
  document.getElementById('projectTitle').textContent = project.title;
  document.getElementById('projectSubline').textContent = `${project.category || ''}${project.category && project.year ? ' / ' : ''}${project.year || ''}`;
  document.getElementById('projectCount').innerHTML = `<span class="current">${String(projectIndex + 1).padStart(2,'0')}</span> / ${String(projects.length).padStart(2,'0')}`;

  const previousUrl = `project.html?id=${encodeURIComponent(previousProject.id)}`;
  document.getElementById('prevTop').href = previousUrl;
  document.getElementById('prevTop').setAttribute('aria-label',`Previous project: ${previousProject.title}`);

  const nextUrl = `project.html?id=${encodeURIComponent(nextProject.id)}`;
  document.getElementById('nextTop').href = nextUrl;
  document.getElementById('nextTop').setAttribute('aria-label',`Next project: ${nextProject.title}`);
  document.getElementById('nextFooterTitle').href = nextUrl;
  document.getElementById('nextFooterTitle').textContent = nextProject.title;
  document.getElementById('nextFooterArrow').href = nextUrl;
  document.getElementById('nextFooterArrow').setAttribute('aria-label',`Next project: ${nextProject.title}`);

  /* If projects.js contains problem / insight / idea, those are shown exactly.
     Until those fields are added, the existing description is preserved rather
     than inventing strategy copy. */
  const strategyGrid = document.getElementById('strategyGrid');
  const hasStrategy = Boolean(project.problem || project.insight || project.idea);

  if(hasStrategy){
    const strategyItems = [
      ['The Problem',project.problem],
      ['The Insight',project.insight],
      ['The Idea',project.idea || project.description]
    ].filter(([,copy]) => copy);

    strategyGrid.innerHTML = strategyItems.map(([heading,copy]) => `
      <article class="strategy-item">
        <h2>${heading}</h2>
        <p>${escapeHTML(copy)}</p>
      </article>
    `).join('');
  } else {
    strategyGrid.classList.add('strategy-grid--overview');
    strategyGrid.innerHTML = `
      <article class="strategy-item">
        <h2>Project</h2>
        <p>${escapeHTML(project.description || '')}</p>
      </article>
      <div class="strategy-meta">
        <strong>Role</strong>
        <span>${escapeHTML(project.role || '')}</span>
      </div>
      <div class="strategy-meta">
        <strong>Brief Type</strong>
        <span>${escapeHTML(project.briefType || project.category || '')}</span>
      </div>
    `;
  }

  document.getElementById('metaRole').textContent = Array.isArray(project.role) ? project.role.join(' / ') : (project.role || '');
  document.getElementById('metaBrief').textContent = project.briefType || project.category || '';
  document.getElementById('metaYear').textContent = project.year || '';
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  const gallery = project.gallery || [];
  const galleryGrid = document.getElementById('galleryGrid');
  const executionsSection = document.getElementById('executionsSection');

  if(!gallery.length){
    executionsSection.hidden = true;
  } else {
    galleryGrid.innerHTML = gallery.map((item,index) => `
      <figure class="gallery-item" data-lightbox-index="${index}">
        <div class="gallery-image-wrap" style="position:relative;">
          <img src="${galleryItemSrc(item)}" alt="${escapeHTML(project.title)}${galleryItemLabel(item) ? ' — ' + escapeHTML(galleryItemLabel(item)) : ''}" loading="lazy">
          ${badgeHTML(galleryItemAward(item),'badge-pill--sm')}
        </div>
        <figcaption class="gallery-caption">
          <span>${escapeHTML(galleryItemLabel(item))}</span>
          <span>${escapeHTML(galleryItemCaption(item))}</span>
        </figcaption>
      </figure>
    `).join('');

    /* Preserve each image's real proportions. Wide images become full-width;
       portrait and square images can sit two-up on desktop. */
    galleryGrid.querySelectorAll('.gallery-item img').forEach(img => {
      const classify = () => {
        const figure = img.closest('.gallery-item');
        if(!img.naturalWidth || !img.naturalHeight) return;
        const ratio = img.naturalWidth / img.naturalHeight;
        if(ratio >= 1.35) figure.classList.add('is-landscape');
      };
      if(img.complete) classify();
      else img.addEventListener('load',classify,{once:true});
    });
  }

  /* ---------- LIGHTBOX ---------- */
  const lightboxImages = gallery.map(galleryItemSrc);
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCounter = document.getElementById('lightboxCounter');
  const closeButton = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  let lightboxIndex = 0;

  function renderLightbox(){
    lightboxImg.src = lightboxImages[lightboxIndex];
    lightboxImg.alt = `${project.title} image ${lightboxIndex + 1} of ${lightboxImages.length}`;
    lightboxCounter.textContent = `${String(lightboxIndex + 1).padStart(2,'0')} / ${String(lightboxImages.length).padStart(2,'0')}`;
  }

  function openLightbox(index){
    if(!lightboxImages.length) return;
    lightboxIndex = index;
    renderLightbox();
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  function stepLightbox(direction){
    lightboxIndex = (lightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
    renderLightbox();
  }

  document.addEventListener('click',(event) => {
    const target = event.target.closest('[data-lightbox-index]');
    if(!target) return;
    openLightbox(Number(target.dataset.lightboxIndex));
  });

  closeButton.addEventListener('click',closeLightbox);
  lightboxPrev.addEventListener('click',() => stepLightbox(-1));
  lightboxNext.addEventListener('click',() => stepLightbox(1));

  lightbox.addEventListener('click',(event) => {
    if(event.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown',(event) => {
    if(!lightbox.classList.contains('is-open')) return;
    if(event.key === 'Escape') closeLightbox();
    if(event.key === 'ArrowLeft') stepLightbox(-1);
    if(event.key === 'ArrowRight') stepLightbox(1);
  });
</script>
</body>
</html>
