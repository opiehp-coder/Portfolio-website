<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Quests — Hugh Opie</title>
<meta name="description" content="Side quests, photos and personal projects by Hugh Opie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
   :root{
    --blue:#1450C8;
    --black:#0A0A0A;
    --paper:#FBFAF7;
    --white:#FFFFFF;
    --line:rgba(20,80,200,.58);
    --muted:#6F7790;
    --page-pad:clamp(24px,3.4vw,58px);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{scroll-behavior:smooth;}

  body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--paper);
    color:var(--blue);
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .page{
    width:100%;
    max-width:1600px;
    margin:0 auto;
    padding:20px var(--page-pad) 34px;
  }

  /* ---------- HEADER ---------- */
  .site-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:32px;
    min-height:82px;
  }

  .brand-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:52px;
    height:52px;
    flex:0 0 auto;
    text-decoration:none;
  }

  .brand-mark img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }

  .nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:clamp(26px,3.6vw,64px);
    padding-top:16px;
  }

  .nav a{
    position:relative;
    padding-bottom:9px;
    text-decoration:none;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:12px;
    line-height:1;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.01em;
  }

  .nav a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:1.5px;
    background:var(--blue);
    transition:width .22s ease;
  }

  .nav a:hover::after,
  .nav a.active::after{width:100%;}

  /* ---------- HERO ---------- */
  .side-hero{
    display:grid;
    grid-template-columns:minmax(0,1.75fr) minmax(340px,1fr);
    gap:clamp(54px,8vw,130px);
    align-items:start;
    padding:22px 0 48px;
  }

  .side-title{
    font-family:'Anton','Arial Narrow',Impact,sans-serif;
    font-size:clamp(100px,12.7vw,198px);
    line-height:.82;
    font-weight:400;
    letter-spacing:-.02em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .side-intro{
    align-self:start;
    justify-self:end;
    max-width:500px;
    padding-top:9px;
  }

  .side-intro h2{
    margin-bottom:18px;
    font-family:'Montserrat',Arial,sans-serif;
    font-size:clamp(22px,1.8vw,29px);
    line-height:1.05;
    font-weight:800;
    letter-spacing:-.025em;
  }

  .side-intro p{
    font-size:clamp(17px,1.38vw,22px);
    line-height:1.33;
    letter-spacing:-.018em;
  }

  /* ---------- PHOTO DECK ---------- */
  .deck-section{
    border-top:1px solid var(--line);
    padding:clamp(28px,3.2vw,50px) 0 clamp(48px,5vw,78px);
  }

  .deck-wrap{
    width:min(100%, 660px);
    margin:0 auto;
  }

  .deck-stage{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    -webkit-tap-highlight-color:transparent;
  }

  .deck{
    position:relative;
    width:100%;
    height:100%;
  }

  .polaroid{
    position:absolute;
    top:50%;
    left:50%;
    width:82%;
    height:82%;
    background:var(--paper);
    padding:12px 12px 34px;
    border:1px solid rgba(20,80,200,.12);
    border-radius:2px;
    box-shadow:0 16px 34px rgba(10,10,10,.11);
    transition:transform .55s cubic-bezier(.22,.68,0,1.01),opacity .45s ease;
    will-change:transform,opacity;
  }

  .polaroid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#ECEBE8;
  }

  .deck-zone{
    position:absolute;
    top:0;
    bottom:0;
    width:50%;
    z-index:200;
    border:0;
    padding:0;
    background:transparent;
    color:var(--blue);
    cursor:pointer;
    opacity:0;
    transition:opacity .2s ease;
  }

  .deck-zone--left{left:0;}
  .deck-zone--right{right:0;}

  .deck-zone::after{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-family:Arial,sans-serif;
    font-size:32px;
    line-height:1;
  }

  .deck-zone--left::after{content:'←';left:4px;}
  .deck-zone--right::after{content:'→';right:4px;}

  .deck-stage:hover .deck-zone,
  .deck-zone:focus-visible{opacity:1;}

  .deck-counter{
    margin-top:15px;
    text-align:center;
    font-family:'Montserrat',Arial,sans-serif;
    font-weight:700;
    font-size:11px;
    line-height:1;
    letter-spacing:.12em;
    color:var(--muted);
  }

  .deck-counter .current{color:var(--blue);}

  /* ---------- FOOTER ---------- */
  .site-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    padding:17px 0 4px;
    border-top:1px solid var(--line);
    font-family:'Montserrat',Arial,sans-serif;
    font-size:11px;
    line-height:1;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--blue);
  }

  .footer-links{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
  }

  .footer-links a{
    color:inherit;
    text-decoration:none;
  }

  .footer-links a:hover{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  :focus-visible{
    outline:2px solid var(--blue);
    outline-offset:4px;
  }

  /* ---------- TABLET ---------- */
  @media (max-width:1180px){
    .side-hero{
      grid-template-columns:1fr;
      gap:30px;
      padding-top:12px;
    }

    .side-title{
      font-size:clamp(86px,17vw,160px);
      white-space:normal;
    }

    .side-intro{
      justify-self:start;
      max-width:680px;
      padding-top:0;
    }

    .deck-wrap{width:min(100%,610px);}
  }

  /* ---------- MOBILE ---------- */
  @media (max-width:680px){
    .page{padding:18px 18px 28px;}

    .site-header{
      min-height:auto;
      align-items:center;
      margin-bottom:26px;
    }

    .brand-mark{width:42px;height:42px;}

    .nav{
      gap:16px;
      padding-top:0;
      flex-wrap:wrap;
    }

    .nav a{
      font-size:10px;
      padding-bottom:7px;
    }

    .side-hero{
      gap:24px;
      padding:6px 0 34px;
    }

    .side-title{
      font-size:clamp(66px,22vw,108px);
      line-height:.86;
    }

    .side-intro h2{
      margin-bottom:12px;
      font-size:20px;
    }

    .side-intro p{
      font-size:16px;
      line-height:1.4;
    }

    .deck-section{
      padding:26px 0 46px;
    }

    .deck-wrap{width:min(100%,390px);}

    .deck-zone{opacity:1;}
    .deck-zone::after{font-size:25px;}
    .deck-zone--left::after{left:0;}
    .deck-zone--right::after{right:0;}

    .site-footer{
      align-items:flex-start;
      flex-direction:column;
      font-size:10px;
    }
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none!important;}
  }
</style>
</head>
<body>

<main class="page">
  <header class="site-header">
    <a class="brand-mark" href="/" aria-label="Hugh Opie home">
      <img src="favicon.png" alt="">
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="/">Work</a>
      <a href="/side-quests" class="active" aria-current="page">Side Quests</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <section class="side-hero" aria-labelledby="page-title">
    <h1 class="side-title" id="page-title">Side Quests</h1>

    <div class="side-intro">
      <h2>Creating uncle lore</h2>
      <p>
        When I'm not writing copy, I like to hike for 5 days
        with zero experience, take photos of my friends,
        work on my clothing brand, and try to gather as much uncle lore as possible.
      </p>
    </div>
  </section>

  <section class="deck-section" aria-label="Side quest photo deck">
    <div class="deck-wrap">
      <div class="deck-stage" id="deckStage">
        <div class="deck" id="deck"></div>
        <button class="deck-zone deck-zone--left" id="deckPrev" aria-label="Previous photo"></button>
        <button class="deck-zone deck-zone--right" id="deckNext" aria-label="Next photo"></button>
      </div>
      <div class="deck-counter" id="deckCounter"></div>
    </div>
  </section>

  <footer class="site-footer">
    <span>© <span id="footerYear"></span> Hugh Opie</span>
    <div class="footer-links">
      <a href="mailto:hugh@hopie.com.au">Email</a>
      <a href="https://www.linkedin.com/in/hugh-opie" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="Hugh_Opie_Resume.pdf" download>Résumé</a>
    </div>
  </footer>
</main>

<script src="sidequest.js"></script>
<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  /* =========================================================
     SIDE QUEST DECK — existing card-stack carousel behaviour.
     The photo manifest still lives in sidequest.js.
     ========================================================= */
  (function(){
    const photos = (typeof sideQuestPhotos !== 'undefined') ? sideQuestPhotos : [];
    if (!photos.length) return;

    const deckEl = document.getElementById('deck');
    const counterEl = document.getElementById('deckCounter');
    const prevBtn = document.getElementById('deckPrev');
    const nextBtn = document.getElementById('deckNext');
    const stageEl = document.getElementById('deckStage');

    const N = photos.length;
    const STACK_SIZE = Math.min(5, N);
    const TILTS = [-4, 3, -2, 5, -3, 2, -5, 4];
    const PLACEHOLDER =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500">' +
        '<rect width="400" height="500" fill="%23ECEBE8"/>' +
        '<text x="50%" y="50%" font-family="Arial" font-size="16" fill="%236F7790" text-anchor="middle">Add photo</text>' +
        '</svg>'
      );

    let currentIndex = 0;
    let autoTimer = null;

    const cardEls = photos.map((photo, i) => {
      const card = document.createElement('div');
      card.className = 'polaroid';

      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.alt || `Side quest photo ${i + 1}`;
      img.loading = 'lazy';
      img.addEventListener('error', function(){ this.src = PLACEHOLDER; }, { once:true });

      card.appendChild(img);
      deckEl.appendChild(card);
      return card;
    });

    function styleForSlot(slot, tilt){
      if (slot === 0){
        return { x:0, y:0, scale:1, rotate:tilt, z:100, opacity:1 };
      }

      if (slot > 0 && slot < STACK_SIZE){
        const dir = slot % 2 === 0 ? 1 : -1;
        return {
          x:dir * slot * 5,
          y:slot * 11,
          scale:1 - slot * .045,
          rotate:tilt + dir * slot * 3,
          z:100 - slot * 10,
          opacity:1 - slot * .14
        };
      }

      return { x:0, y:60, scale:.8, rotate:tilt, z:0, opacity:0 };
    }

    function render(){
      photos.forEach((photo, i) => {
        const slot = (i - currentIndex + N) % N;
        const tilt = TILTS[i % TILTS.length];
        const s = styleForSlot(slot, tilt);
        const card = cardEls[i];

        card.style.transform =
          `translate(-50%, -50%) translate(${s.x}px, ${s.y}px) rotate(${s.rotate}deg) scale(${s.scale})`;
        card.style.zIndex = s.z;
        card.style.opacity = s.opacity;
        card.style.pointerEvents = slot === 0 ? 'auto' : 'none';
      });

      counterEl.innerHTML =
        `<span class="current">${String(currentIndex + 1).padStart(2, '0')}</span> / ${String(N).padStart(2, '0')}`;
    }

    function next(){
      currentIndex = (currentIndex + 1) % N;
      render();
    }

    function prev(){
      currentIndex = (currentIndex - 1 + N) % N;
      render();
    }

    function startAuto(){
      stopAuto();
      autoTimer = setInterval(next, 4000);
    }

    function stopAuto(){
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
    }

    function manualNext(){next();startAuto();}
    function manualPrev(){prev();startAuto();}

    nextBtn.addEventListener('click', manualNext);
    prevBtn.addEventListener('click', manualPrev);

    stageEl.addEventListener('mouseenter', stopAuto);
    stageEl.addEventListener('mouseleave', startAuto);

    let touchStartX = null;
    stageEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive:true });

    stageEl.addEventListener('touchend', (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40){
        dx < 0 ? manualNext() : manualPrev();
      }
      touchStartX = null;
    }, { passive:true });

    render();
    startAuto();
  })();
</script>

</body>
</html>
