<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Quests — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-blue:#1450C8;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --border-grey:#E4E4E4;
    --mute-grey:#B9B9B9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{ height:100%; }

  body{
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--white);
    font-family:'Inter', sans-serif;
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2vh 2vw;
  }

  .frame{
    width:100%;
    max-width:1440px;
    height:100%;
    max-height:96vh;
    border:1px solid var(--border-grey);
    border-radius:20px;
    padding:2.4vh 2.4vw;
    display:flex;
    flex-direction:column;
    gap:1.6vh;
    overflow:hidden;
  }

  /* ---------- NAV (shared across pages) ---------- */
  .top-nav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:2.4vw;
  }

  .nav-link{
    text-decoration:none;
    color:var(--black);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:clamp(11px, 1vw, 13px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    transition:color .25s ease;
  }

  .nav-link::after{
    content:'';
    position:absolute;
    left:0; bottom:0;
    width:0%;
    height:1.5px;
    background:var(--deep-blue);
    transition:width .3s ease;
  }

  .nav-link:hover{color:var(--deep-blue);}
  .nav-link:hover::after{width:100%;}

  .nav-link.active{
    color:var(--deep-blue);
    font-weight:700;
  }
  .nav-link.active::after{
    width:100%;
  }

  .nav-link:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  /* ---------- FOOTER ---------- */
  .site-footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-top:1.1vh;
    border-top:1px solid var(--border-grey);
  }

  .footer-copy{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--mute-grey);
    white-space:nowrap;
  }

  .footer-copy .dot{ color:var(--border-grey); }

  .footer-social{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .footer-social a{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border-grey);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--deep-blue);
    text-decoration:none;
    transition:background-color .25s ease, border-color .25s ease, color .25s ease, transform .2s ease;
  }

  .footer-social a svg{
    width:13px;
    height:13px;
    fill:currentColor;
  }

  .footer-social a:hover{
    background:var(--deep-blue);
    border-color:var(--deep-blue);
    color:var(--white);
    transform:translateY(-2px);
  }

  .footer-social a:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  @media (max-width: 480px){
    .site-footer{
      flex-wrap:wrap;
      gap:12px;
    }
    .footer-copy{ white-space:normal; }
  }

  /* ---------- PAGE CONTENT: text left, deck right (mirrors About Me hero) ---------- */
  .content{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:4vw;
    align-items:center;
  }

  .side-text{
    display:flex;
    flex-direction:column;
    gap:2vh;
    min-width:0;
  }

  .eyebrow{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:clamp(11px, 1vw, 13px);
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--deep-blue);
  }

  .page-title{
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(32px, 5.6vh, 64px);
    line-height:1.02;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    color:var(--deep-blue);
    max-width:12ch;
  }

  .page-copy{
    font-size:clamp(13px, 1.1vw, 16px);
    line-height:1.6;
    color:var(--black);
    max-width:52ch;
  }

  /* ---------- SIDE QUEST DECK (right column, same footprint as hero-photo) ---------- */
  .deck-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.6vh;
    width:100%;
  }

  .deck-stage{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    -webkit-tap-highlight-color:transparent;
  }

  .deck{
    position:relative;
    width:100%;
    height:100%;
  }

  .polaroid{
    position:absolute;
    top:50%;
    left:50%;
    width:82%;
    height:82%;
    background:#fff;
    padding:12px 12px 34px;
    border-radius:6px;
    box-shadow:0 18px 36px rgba(0,0,0,0.16), 0 4px 10px rgba(0,0,0,0.08);
    transition:transform .55s cubic-bezier(.22,.68,0,1.01), opacity .5s ease;
    will-change:transform, opacity;
  }

  .polaroid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:2px;
    background:#eee;
  }

  .deck-zone{
    position:absolute;
    top:0;
    bottom:0;
    width:50%;
    border:none;
    background:transparent;
    cursor:pointer;
    padding:0;
    display:flex;
    align-items:center;
    z-index:200;
  }

  .deck-zone--left{ left:0; justify-content:flex-start; }
  .deck-zone--right{ right:0; justify-content:flex-end; }

  .deck-zone::after{
    content:'';
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--white);
    border:1px solid var(--border-grey);
    box-shadow:0 6px 16px rgba(0,0,0,0.12);
    opacity:0;
    transform:scale(0.7);
    transition:opacity .2s ease, transform .2s ease;
    margin:0 -6px;
    background-repeat:no-repeat;
    background-position:center;
    background-size:14px 14px;
  }

  .deck-zone--left::after{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231450C8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M15 18l-6-6 6-6'/></svg>");
  }

  .deck-zone--right::after{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231450C8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>");
  }

  .deck-stage:hover .deck-zone::after{
    opacity:1;
    transform:scale(1);
  }

  .deck-zone:focus-visible::after{
    opacity:1;
    transform:scale(1);
    outline:2px solid var(--deep-blue);
    outline-offset:2px;
  }

  .deck-counter{
    flex:0 0 auto;
    text-align:center;
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--mute-grey);
  }

  .deck-counter .current{ color:var(--deep-blue); }

  @media (prefers-reduced-motion: reduce){
    .polaroid{ transition:none; }
  }

  /* ================= MOBILE: stacks vertically, deck above text — matches About Me hero ================= */
  @media (max-width: 768px){
    body{
      height:auto;
      overflow-y:auto;
      overflow-x:hidden;
      display:block;
      padding:16px;
    }

    .frame{
      height:auto;
      max-height:none;
      overflow:visible;
      border-radius:16px;
      padding:20px 16px 28px;
      gap:24px;
    }

    .top-nav{ flex-wrap:wrap; gap:20px; }

    .content{
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .deck-col{ order:1; }
    .side-text{ order:2; }

    .deck-stage{ max-width:340px; margin:0 auto; }

    .page-title{ max-width:100%; font-size:clamp(28px, 9vw, 42px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="frame">

  <nav class="top-nav">
    <a href="index.html" class="nav-link">Work</a>
    <a href="about.html" class="nav-link">About Me</a>
    <a href="side-quests.html" class="nav-link active">Side Quests</a>
  </nav>

  <div class="content">
    <div class="side-text">
      <div class="eyebrow">Side Quests</div>
      <h1 class="page-title">Creating uncle lore</h1>
      <p class="page-copy">
        When I'm not writing copy, I like to hike for 5 days 
        with zero experience, take photos of my friends,

      </p>
    </div>

    <div class="deck-col">
      <div class="deck-stage" id="deckStage">
        <div class="deck" id="deck"></div>
        <button class="deck-zone deck-zone--left" id="deckPrev" aria-label="Previous photo"></button>
        <button class="deck-zone deck-zone--right" id="deckNext" aria-label="Next photo"></button>
      </div>
      <div class="deck-counter" id="deckCounter"></div>
    </div>
  </div>

 <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-copy">
      <span>&copy; <span id="footerYear"></span> Hugh Opie</span>
      <span class="dot">&middot;</span>
      <span>All rights reserved</span>
    </div>
    <div class="footer-social">
      <a href="https://www.linkedin.com/in/hugh-opie" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8h4V23h-4V8zM8.5 8h3.8v2.05h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V23h-4v-6.9c0-1.65-.03-3.77-2.3-3.77-2.3 0-2.65 1.8-2.65 3.65V23h-4V8z"/></svg>
      </a>
      <a href="mailto:hugh@hopie.com.au" aria-label="Send an email">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 4h20a1 1 0 011 1v14a1 1 0 01-1 1H2a1 1 0 01-1-1V5a1 1 0 011-1zm1.4 2L12 12.5 20.6 6H3.4zM1 7.4V18h22V7.4l-11 8.1L1 7.4z"/></svg>
      </a>
    </div>
  </footer>

</div>

<script src="sidequest.js"></script>
<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  /* =========================================================
     SIDE QUEST DECK — card-stack carousel
     Persistent DOM elements, one per photo. Each element's slot
     (position in the stack) is recalculated from currentIndex,
     so CSS transitions animate the slide/flip automatically —
     no manual enter/exit choreography needed.
     ========================================================= */
  (function(){
    const photos = (typeof sideQuestPhotos !== 'undefined') ? sideQuestPhotos : [];
    if (!photos.length) return;

    const deckEl = document.getElementById('deck');
    const counterEl = document.getElementById('deckCounter');
    const prevBtn = document.getElementById('deckPrev');
    const nextBtn = document.getElementById('deckNext');
    const stageEl = document.getElementById('deckStage');

    const N = photos.length;
    const STACK_SIZE = Math.min(5, N);
    const TILTS = [-4, 3, -2, 5, -3, 2, -5, 4]; // deg, cycled per photo
    const PLACEHOLDER =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500">' +
        '<rect width="400" height="500" fill="%23f2f2f2"/>' +
        '<text x="50%" y="50%" font-family="Arial" font-size="16" fill="%23B9B9B9" text-anchor="middle">Add photo</text>' +
        '</svg>'
      );

    let currentIndex = 0;
    let autoTimer = null;

    // Build one persistent element per photo
    const cardEls = photos.map((photo, i) => {
      const card = document.createElement('div');
      card.className = 'polaroid';
      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.alt || `Side quest photo ${i + 1}`;
      img.loading = 'lazy';
      img.addEventListener('error', function(){ this.src = PLACEHOLDER; }, { once: true });
      card.appendChild(img);
      deckEl.appendChild(card);
      return card;
    });

    function styleForSlot(slot, tilt){
      if (slot === 0){
        return { x: 0, y: 0, scale: 1, rotate: tilt, z: 100, opacity: 1 };
      }
      if (slot > 0 && slot < STACK_SIZE){
        const dir = slot % 2 === 0 ? 1 : -1;
        return {
          x: dir * slot * 5,
          y: slot * 11,
          scale: 1 - slot * 0.045,
          rotate: tilt + dir * slot * 3,
          z: 100 - slot * 10,
          opacity: 1 - slot * 0.14
        };
      }
      // Deep in the stack / off-deck: faded out behind everything
      return { x: 0, y: 60, scale: 0.8, rotate: tilt, z: 0, opacity: 0 };
    }

    function render(){
      photos.forEach((photo, i) => {
        const slot = (i - currentIndex + N) % N;
        const tilt = TILTS[i % TILTS.length];
        const s = styleForSlot(slot, tilt);
        const card = cardEls[i];
        card.style.transform =
          `translate(-50%, -50%) translate(${s.x}px, ${s.y}px) rotate(${s.rotate}deg) scale(${s.scale})`;
        card.style.zIndex = s.z;
        card.style.opacity = s.opacity;
        card.style.pointerEvents = slot === 0 ? 'auto' : 'none';
      });
      counterEl.innerHTML =
        `<span class="current">${String(currentIndex + 1).padStart(2, '0')}</span> / ${String(N).padStart(2, '0')}`;
    }

    function next(){
      currentIndex = (currentIndex + 1) % N;
      render();
    }

    function prev(){
      currentIndex = (currentIndex - 1 + N) % N;
      render();
    }

    function startAuto(){
      stopAuto();
      autoTimer = setInterval(next, 4000);
    }

    function stopAuto(){
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
    }

    function manualNext(){ next(); startAuto(); }
    function manualPrev(){ prev(); startAuto(); }

    nextBtn.addEventListener('click', manualNext);
    prevBtn.addEventListener('click', manualPrev);

    // Pause on hover
    stageEl.addEventListener('mouseenter', stopAuto);
    stageEl.addEventListener('mouseleave', startAuto);

    // Touch swipe support
    let touchStartX = null;
    stageEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    stageEl.addEventListener('touchend', (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40){
        dx < 0 ? manualNext() : manualPrev();
      }
      touchStartX = null;
    }, { passive: true });

    render();
    startAuto();
  })();
</script>

</body>
</html>
