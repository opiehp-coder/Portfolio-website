<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Editorial Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-blue:#1450C8;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --border-grey:#E4E4E4;
    --mute-grey:#B9B9B9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{ height:100%; }

  body{
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--white);
    font-family:'Inter', sans-serif;
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2vh 2vw;
  }

  /* ============ FRAME (desktop: fixed to viewport) ============ */
  .frame{
    width:100%;
    max-width:1440px;
    height:100%;
    max-height:96vh;
    border:1px solid var(--border-grey);
    border-radius:20px;
    padding:2.4vh 2.4vw;
    display:flex;
    flex-direction:column;
    gap:1.6vh;
    overflow:hidden;
  }

  /* ---------- NAV ---------- */
  .nav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:2.4vw;
  }

  .nav a{
    text-decoration:none;
    color:var(--black);
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:clamp(11px, 1vw, 13px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    transition:color .25s ease;
  }

  .nav a::after{
    content:'';
    position:absolute;
    left:0; bottom:0;
    width:0%;
    height:1.5px;
    background:var(--deep-blue);
    transition:width .3s ease;
  }

  .nav a:hover{color:var(--deep-blue);}
  .nav a:hover::after{width:100%;}
  .nav a.active{
    color:var(--deep-blue);
    font-weight:700;
  }
  .nav a.active::after{width:100%;}

  /* ---------- MAIN DISPLAY ---------- */
  .display{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns: 0.85fr 1.15fr;
    gap:3vw;
  }

  /* LEFT COLUMN */
  .col-left{
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .pagination{
    flex:0 0 auto;
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(24px, 4.4vh, 46px);
    color:var(--black);
    letter-spacing:-0.01em;
    display:flex;
    align-items:baseline;
    gap:4px;
  }

  .pagination .current{color:var(--deep-blue);}
  .pagination .slash{color:var(--mute-grey); font-weight:400; margin:0 2px;}
  .pagination .total{color:var(--mute-grey); font-size:0.55em;}

  .title-block{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    overflow:hidden;
  }

  .project-title{
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(22px, 5vh, 58px);
    line-height:1.03;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    color:var(--deep-blue);
    text-align:left;
    max-width:11ch;
    transition:opacity .35s ease;
  }

  /* RIGHT COLUMN */
  .col-right{
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:1.2vh;
  }

  .image-frame{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    border-radius:10px;
    overflow:hidden;
    background:#f2f2f2;
  }

  .image-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:opacity .4s ease;
  }

  /* ---------- AWARD PILL BADGE (project or gallery item with an `award` set) ---------- */
  /* Always visible — no hover needed. Solid white/blue palette per the site design system. */
  .badge-pill{
    position:absolute;
    top:12px;
    right:12px;
    z-index:30;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    border:1.5px solid var(--deep-blue);
    border-radius:9999px;
    padding:5px 12px 5px 5px;
    color:var(--deep-blue);
    pointer-events:none;
    box-shadow:0 4px 12px rgba(20,80,200,0.18);
  }

  .badge-pill-icon{
    width:20px;
    height:20px;
    flex:0 0 auto;
    color:var(--deep-blue);
  }

  .badge-pill-icon svg{
    width:100%;
    height:100%;
    display:block;
  }

  .badge-pill-label{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    white-space:nowrap;
    line-height:1;
  }

  /* Smaller variant for thumbnail-sized contexts */
  .badge-pill--sm{
    top:6px;
    right:6px;
    padding:3px 9px 3px 3px;
    gap:4px;
  }

  .badge-pill--sm .badge-pill-icon{ width:14px; height:14px; }
  .badge-pill--sm .badge-pill-label{ font-size:7.5px; letter-spacing:0.03em; }

  .meta-row{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }

  .meta-left{
    font-family:'Inter', sans-serif;
    font-size:clamp(10px, 1vw, 12px);
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--black);
    font-weight:500;
  }

  .meta-left .divider{color:var(--mute-grey); margin:0 6px;}

  .view-more{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:clamp(10px, 1vw, 12px);
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--deep-blue);
    text-decoration:none;
    display:inline-block;
    padding-bottom:3px;
    border-bottom:1.5px solid var(--deep-blue);
    transition:letter-spacing .25s ease;
    white-space:nowrap;
  }

  .view-more:hover{ letter-spacing:0.16em; }

  /* ---------- THUMBNAILS ---------- */
  .thumbs-wrap{
    flex:0 0 auto;
    height:14vh;
    max-height:130px;
    display:flex;
    flex-direction:column;
  }

  .thumbs{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    gap:1.2vw;
  }

  .thumb{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
    font-family:inherit;
    min-height:0;
    height:100%;
    position:relative;
  }

  .thumb-num{
    flex:0 0 auto;
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:clamp(9px, 0.85vw, 11px);
    color:var(--black);
    letter-spacing:0.05em;
  }

  .thumb-img-wrap{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    border-radius:6px;
    overflow:hidden;
    background:#eee;
    position:relative;
    border:1.5px solid transparent;
    transition:border-color .25s ease, box-shadow .25s ease, transform .2s ease;
  }

  .thumb-img-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(100%) opacity(35%);
    transition:filter .3s ease;
  }

  .thumb:hover .thumb-img-wrap img{ filter:grayscale(0%) opacity(100%); }
  .thumb:hover .thumb-img-wrap{ transform:translateY(-2px); }
  .thumb.active .thumb-img-wrap img{ filter:grayscale(0%) opacity(100%); }
  .thumb.active .thumb-img-wrap{
    border-color:var(--deep-blue);
    box-shadow:0 6px 18px rgba(11,30,75,0.18);
  }
  .thumb.active .thumb-num{ color:var(--deep-blue); }

  .thumb:focus-visible .thumb-img-wrap,
  .nav a:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  /* ---------- FOOTER ---------- */
  .site-footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-top:1.1vh;
    border-top:1px solid var(--border-grey);
  }

  .footer-copy{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--mute-grey);
    white-space:nowrap;
  }

  .footer-copy .dot{ color:var(--border-grey); }

  .footer-social{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .footer-social a{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border-grey);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--deep-blue);
    text-decoration:none;
    transition:background-color .25s ease, border-color .25s ease, color .25s ease, transform .2s ease;
  }

  .footer-social a svg{
    width:13px;
    height:13px;
    fill:currentColor;
  }

  .footer-social a:hover{
    background:var(--deep-blue);
    border-color:var(--deep-blue);
    color:var(--white);
    transform:translateY(-2px);
  }

  .footer-social a:focus-visible{
    outline:2px solid var(--deep-blue);
    outline-offset:3px;
  }

  @media (max-width: 480px){
    .site-footer{
      flex-wrap:wrap;
      gap:12px;
    }
    .footer-copy{ white-space:normal; }
  }

  /* ================= MOBILE / SMALL SCREENS ================= */
  @media (max-width: 768px){

    body{
      height:auto;
      overflow-y:auto;
      overflow-x:hidden;
      display:block;
      padding:16px;
    }

    .frame{
      height:auto;
      max-height:none;
      overflow:visible;
      border-radius:16px;
      padding:20px 16px 24px;
      gap:20px;
    }

    /* 1. Nav stacked top-left */
    .nav{
      flex-direction:row;
      flex-wrap:wrap;
      gap:20px;
    }

    /* Reflow: image+meta, then title/pagination, then thumbnails */
    .display{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .col-right{ order:1; gap:12px; }
    .col-left{ order:2; }

    .image-frame{
      flex:none;
      aspect-ratio:4/5;
      width:100%;
    }

    .pagination{ font-size:32px; }

    .title-block{
      flex:none;
      padding:4px 0;
    }

    .project-title{
      font-size:clamp(26px, 8vw, 40px);
      max-width:100%;
    }

    .meta-row{
      align-items:flex-start;
      flex-direction:column;
      gap:10px;
    }

    /* 3. Thumbnail strip: horizontally scrollable, touch-friendly */
    .thumbs-wrap{
      height:auto;
      max-height:none;
    }

    .thumbs{
      grid-auto-flow:column;
      grid-auto-columns:minmax(96px, 1fr);
      overflow-x:auto;
      overflow-y:hidden;
      padding-bottom:6px;
      scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch;
    }

    .thumb{
      scroll-snap-align:start;
      min-width:96px;
    }

    .thumb-img-wrap{
      aspect-ratio:3/4;
      min-height:44px;
    }

    .thumb-num{ font-size:11px; }
  }

  @media (max-width: 420px){
    .nav a{ font-size:12px; letter-spacing:0.1em; }
    .thumbs{ grid-auto-columns:minmax(84px, 1fr); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="frame">

  <!-- NAVIGATION -->
  <nav class="nav top-nav">
    <a href="/" class="nav-link active">Work</a>
    <a href="/about" class="nav-link">About Me</a>
    <a href="/side-quests" class="nav-link">Side Quests</a>
  </nav>

  <!-- MAIN DISPLAY -->
  <div class="display">

    <div class="col-left">
      <div class="pagination">
        <span class="current" id="currentNum">04</span><span class="slash">/</span><span class="total" id="totalNum">09</span>
      </div>

      <div class="title-block">
        <h1 class="project-title" id="projectTitle">L'OFFICIELE FASHION MAGAZINE</h1>
      </div>
    </div>

    <div class="col-right">
      <div class="image-frame">
        <img id="activeImage" src="" alt="">
        <div id="heroBadgeSlot"></div>
      </div>
      <div class="meta-row">
        <div class="meta-left" id="projectMeta">FUTURE OVERTURE <span class="divider">/</span> AN YU</div>
        <a href="#" class="view-more" id="viewMoreLink">View More</a>
      </div>
    </div>

  </div>

  <!-- THUMBNAILS -->
  <div class="thumbs-wrap">
    <div class="thumbs" id="thumbs"></div>
  </div>

 <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-copy">
      <span>&copy; <span id="footerYear"></span> Hugh Opie</span>
      <span class="dot">&middot;</span>
      <span>All rights reserved</span>
    </div>
    <div class="footer-social">
      <a href="https://www.linkedin.com/in/hugh-opie" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8h4V23h-4V8zM8.5 8h3.8v2.05h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V23h-4v-6.9c0-1.65-.03-3.77-2.3-3.77-2.3 0-2.65 1.8-2.65 3.65V23h-4V8z"/></svg>
      </a>
      <a href="mailto:hugh@hopie.com.au" aria-label="Send an email">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 4h20a1 1 0 011 1v14a1 1 0 01-1 1H2a1 1 0 01-1-1V5a1 1 0 011-1zm1.4 2L12 12.5 20.6 6H3.4zM1 7.4V18h22V7.4l-11 8.1L1 7.4z"/></svg>
      </a>
    </div>
  </footer>

</div>

<script src="projects.js"></script>
<script>
  /* Page logic for the gallery view. Project data itself lives in
     projects.js so it can be shared with project.html. */

  const DEFAULT_INDEX = 3; // project shown on page load (L'OFFICIELE FASHION MAGAZINE)

  const thumbsEl = document.getElementById('thumbs');
  const activeImage = document.getElementById('activeImage');
  const projectTitle = document.getElementById('projectTitle');
  const projectMeta = document.getElementById('projectMeta');
  const currentNum = document.getElementById('currentNum');
  const totalNum = document.getElementById('totalNum');
  const viewMoreLink = document.getElementById('viewMoreLink');
  const heroBadgeSlot = document.getElementById('heroBadgeSlot');

  totalNum.textContent = String(projects.length).padStart(2, '0');

  // Build the "View More" URL for a given project using its id
  function viewMoreUrlFor(project){
    return `project.html?id=${project.id}`;
  }

  // Pill badge markup — used on any project/gallery item with an `award` object set.
  // Always visible (no hover needed), fixed white/blue palette per the site design system.
  function defaultLabelForType(type){
    if (type === 'best_in_book') return 'BEST IN BOOK';
    if (type === 'second_best_in_book') return 'SECOND BEST IN BOOK';
    if (type === 'best_in_brief') return 'BEST IN BRIEF';
    return '';
  }

  function badgeHTML(award, sizeClass){
    if (!award) return '';
    const label = award.label || defaultLabelForType(award.type);
    if (!label) return '';
    return `
      <div class="badge-pill${sizeClass ? ' ' + sizeClass : ''}">
        <span class="badge-pill-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 5.3l1.9 4.1 4.4.5-3.3 3 .9 4.4-3.9-2.3-3.9 2.3.9-4.4-3.3-3 4.4-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="badge-pill-label">${label}</span>
      </div>
    `;
  }

  function renderThumbs(){
    thumbsEl.innerHTML = '';
    projects.forEach((p, i) => {
      const num = String(i + 1).padStart(2, '0');
      const btn = document.createElement('button');
      btn.className = 'thumb' + (i === DEFAULT_INDEX ? ' active' : '');
      btn.setAttribute('data-index', i);
      btn.setAttribute('aria-label', `View project ${num}: ${p.title}`);
      btn.innerHTML = `
        <span class="thumb-num">${num}</span>
        <span class="thumb-img-wrap">
          <img src="${p.thumbImage}" alt="${p.title} thumbnail" loading="lazy">
          ${p.award ? badgeHTML(p.award, 'badge-pill--sm') : ''}
        </span>
      `;
      btn.addEventListener('click', () => setActive(i));
      thumbsEl.appendChild(btn);
    });
  }

  function setActive(index){
    const p = projects[index];

    document.querySelectorAll('.thumb').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });

    activeImage.style.opacity = 0;
    projectTitle.style.opacity = 0;

    setTimeout(() => {
      currentNum.textContent = String(index + 1).padStart(2, '0');
      projectTitle.textContent = p.title;
      projectMeta.innerHTML = p.subheading.replace(' / ', ' <span class="divider">/</span> ');
      activeImage.src = p.fullImage;
      activeImage.alt = p.title;
      viewMoreLink.href = viewMoreUrlFor(p);
      heroBadgeSlot.innerHTML = p.award ? badgeHTML(p.award, '') : '';

      activeImage.style.opacity = 1;
      projectTitle.style.opacity = 1;
    }, 180);
  }

  renderThumbs();

  // Footer copyright year
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  // Initialize hero image, title, meta, pagination, and "View More" link from data
const initial = projects[DEFAULT_INDEX];
currentNum.textContent = String(DEFAULT_INDEX + 1).padStart(2, '0');
projectTitle.textContent = initial.title;
projectMeta.innerHTML = initial.subheading.replace(' / ', ' <span class="divider">/</span> ');
activeImage.src = initial.fullImage;
activeImage.alt = initial.title;
viewMoreLink.href = viewMoreUrlFor(initial);
heroBadgeSlot.innerHTML = initial.award ? badgeHTML(initial.award, '') : '';
</script>

</body>
</html>
