<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  if(sessionStorage.getItem('portfolioUnlocked') !== 'true'){
    window.location.replace('/');
  }
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Under Renovations — Hugh Opie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="favicon.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --blue:#1450C8;
      --black:#0A0A0A;
      --paper:#FBFAF7;
      --line:rgba(20,80,200,.58);
      --muted:#6F7790;
      --page-pad:clamp(24px,3.4vw,58px);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      min-height:100%;
    }

    body{
      min-height:100vh;
      background:var(--paper);
      color:var(--black);
      font-family:'Inter',Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .page{
      width:100%;
      max-width:1600px;
      min-height:100vh;
      min-height:100svh;
      margin:0 auto;
      padding:20px var(--page-pad) 22px;
      display:flex;
      flex-direction:column;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:32px;
      min-height:72px;
    }

    .logo{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:52px;
      height:52px;
      flex:0 0 auto;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .status{
      padding-top:16px;
      color:var(--blue);
      font-family:'Montserrat',Arial,sans-serif;
      font-size:11px;
      line-height:1;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .content{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:clamp(48px,7vh,96px) 0;
    }

    h1{
      max-width:1150px;
      color:var(--blue);
      font-family:'Anton','Arial Narrow',Impact,sans-serif;
      font-size:clamp(80px,13vw,210px);
      line-height:.82;
      font-weight:400;
      text-transform:uppercase;
      letter-spacing:-.02em;
    }

    .bottom-grid{
      display:grid;
      grid-template-columns:minmax(0,1.25fr) minmax(300px,.72fr);
      gap:clamp(54px,9vw,150px);
      align-items:end;
      margin-top:clamp(50px,7vw,100px);
      padding-top:22px;
      border-top:1px solid var(--line);
    }

    .copy{
      max-width:650px;
      font-size:clamp(18px,1.6vw,25px);
      line-height:1.38;
      letter-spacing:-.02em;
    }

    .copy p + p{
      margin-top:12px;
    }

    .login-label{
      display:block;
      margin-bottom:12px;
      color:var(--blue);
      font-family:'Montserrat',Arial,sans-serif;
      font-size:11px;
      line-height:1;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .password-row{
      display:flex;
      align-items:center;
      gap:14px;
      border-bottom:1px solid var(--blue);
    }

    input{
      width:100%;
      min-width:0;
      border:0;
      outline:0;
      padding:13px 0;
      background:transparent;
      color:var(--black);
      font-family:'Inter',Arial,sans-serif;
      font-size:15px;
    }

    input::placeholder{
      color:var(--muted);
    }

    button{
      flex:0 0 auto;
      border:0;
      padding:13px 0;
      background:transparent;
      color:var(--blue);
      cursor:pointer;
      font-family:'Montserrat',Arial,sans-serif;
      font-size:11px;
      line-height:1;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    button:hover{
      text-decoration:underline;
      text-underline-offset:4px;
    }

    .error{
      min-height:20px;
      margin-top:10px;
      color:var(--blue);
      font-size:12px;
      line-height:1.4;
    }

    footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:28px;
      padding:18px 0 2px;
      border-top:1px solid var(--line);
      color:var(--blue);
      font-family:'Montserrat',Arial,sans-serif;
      font-size:11px;
      line-height:1;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    @media(max-width:700px){
      .page{
        padding:18px 18px 20px;
      }

      .top{
        min-height:64px;
      }

      .logo{
        width:42px;
        height:42px;
      }

      .status{
        padding-top:11px;
        font-size:10px;
      }

      .content{
        padding:52px 0 60px;
      }

      h1{
        font-size:clamp(70px,23vw,125px);
      }

      .bottom-grid{
        grid-template-columns:1fr;
        gap:38px;
        margin-top:54px;
      }

      footer{
        align-items:flex-start;
        flex-direction:column;
        gap:14px;
        padding-top:16px;
        font-size:10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="top">
      <a class="logo" href="/" aria-label="Hugh Opie">
        <img src="favicon.png" alt="">
      </a>

      <div class="status">
        Portfolio maintenance
      </div>
    </div>

    <section class="content">

      <h1>
        Currently<br>
        Under<br>
        Renovations
      </h1>

      <div class="bottom-grid">

        <div class="copy">
          <p>I’m putting some good ads in here.</p>
          <p>Turns out portfolios work better when the work is good.</p>
        </div>

        <form id="passwordForm">
          <label class="login-label" for="password">
            Got the password? Come snoop.
          </label>

          <div class="password-row">
            <input
              id="password"
              type="password"
              placeholder="Enter password"
              autocomplete="current-password"
            >

            <button type="submit">
              Enter →
            </button>
          </div>

          <div class="error" id="errorMessage" aria-live="polite"></div>
        </form>

      </div>

    </section>

    <footer>
      <span>© <span id="year"></span> Hugh Opie</span>
      <span>Junior Copywriter</span>
    </footer>

  </main>

  <script>
    /*
      TEMPORARY PORTFOLIO LOCK

      IMPORTANT:
      This is only a casual client-side lock.
      The password can be discovered by someone inspecting the source code.

      1. Change the password below.
      2. Rename your current portfolio homepage to work.html.
      3. Save this file as index.html.
    */

    const correctPassword = "goodadsplease";

    const unlocked = sessionStorage.getItem('portfolioUnlocked') === 'true';

    if(unlocked){
      window.location.replace('work.html');
    }

    document.getElementById('year').textContent =
      new Date().getFullYear();

    document
      .getElementById('passwordForm')
      .addEventListener('submit', function(event){

        event.preventDefault();

        const enteredPassword =
          document.getElementById('password').value;

        const error =
          document.getElementById('errorMessage');

        if(enteredPassword === correctPassword){

          sessionStorage.setItem(
            'portfolioUnlocked',
            'true'
          );

          window.location.href = 'work.html';

        } else {

          error.textContent =
            'Nice try. No ads for you.';

        }
      });
  </script>

</body>
</html>
